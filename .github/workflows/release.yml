name: Release

# Publishing a GitHub release promotes an image that build.yml has already
# built and smoke-tested; nothing is rebuilt. The source is `latest` when it
# was built from the release commit (the usual case: releasing the head of the
# default branch), otherwise the `sha-<commit>` image of that commit. Either
# way the release tag ends up on the exact digest that passed CI.
#
# Tags added:  <release tag> (e.g. v1.2.3), and for semver tags 1.2.3 and 1.2.
#
# If the build for the release commit is still running (a release created
# together with its tag triggers both workflows at once), this waits for it.
#
# The release itself is then filled in:
#   assets  proxmox-portal.sh (the LXC script) and compose.yml with defaults pinned to this
#           release, plus SHA256SUMS. So on a PVE node
#             bash -c "$(curl -fsSL <server>/<repo>/releases/download/<tag>/proxmox-portal.sh)"
#           installs exactly this release, and releases/latest/download/...
#           always resolves to the newest one.
#   notes   image, digest, install/upgrade commands and verification details,
#           between <!-- release-details --> markers. Hand-written notes
#           outside the markers are kept; a re-run replaces only the section.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a release image (e.g. v1.2.3)
        required: true
        type: string

permissions:
  # write: upload assets and edit the release notes.
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # How long to wait for build.yml to publish the image for the release commit.
  WAIT_MINUTES: "45"

jobs:
  promote:
    name: Promote tested image to ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Resolve release commit
        id: rel
        run: |
          sha="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "sha=$sha"
            echo "short=${sha::7}"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE_TAG is commit $sha"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate the tested image for the release commit
        id: src
        env:
          IMAGE: ${{ steps.rel.outputs.image }}
          SHA: ${{ steps.rel.outputs.sha }}
          SHORT: ${{ steps.rel.outputs.short }}
        run: |
          deadline=$(( SECONDS + WAIT_MINUTES * 60 ))
          while :; do
            for tag in latest "sha-$SHORT"; do
              digest="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)"
              if [ -z "$digest" ]; then
                echo "$IMAGE:$tag does not exist (yet)"
                continue
              fi
              # Pin by digest from here on, so a push to `latest` mid-release
              # cannot change what gets promoted.
              docker pull -q "$IMAGE@$digest" >/dev/null
              rev="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$digest")"
              if [ "$rev" = "$SHA" ]; then
                echo "Using $IMAGE:$tag ($digest), built from $rev"
                {
                  echo "tag=$tag"
                  echo "digest=$digest"
                  echo "ref=$IMAGE@$digest"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$IMAGE:$tag was built from ${rev:-an unknown commit}, not $SHA"
            done
            if (( SECONDS >= deadline )); then
              echo "::error::No image built from $SHA was published within $WAIT_MINUTES minutes. Check the Build workflow for this commit, then re-run this workflow."
              exit 1
            fi
            echo "Waiting for the Build workflow to publish $SHORT..."
            sleep 30
          done

      - name: Verify image before promoting
        run: bash scripts/ci/smoke-test.sh "${{ steps.src.outputs.ref }}"

      - name: Release tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.rel.outputs.image }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}

      - name: Retag
        env:
          SOURCE: ${{ steps.src.outputs.ref }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(--tag "$t")
          done <<< "$TAGS"
          # Copies the manifest index server-side: same digest, no rebuild.
          docker buildx imagetools create "${args[@]}" "$SOURCE"

      - name: Verify release tags point at the tested digest
        env:
          DIGEST: ${{ steps.src.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          status=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            got="$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$got" = "$DIGEST" ]; then
              echo "ok   $t -> $got"
            else
              echo "::error::$t points at $got, expected $DIGEST"
              status=1
            fi
          done <<< "$TAGS"
          exit "$status"

      - name: Read tool versions from the image
        id: versions
        env:
          REF: ${{ steps.src.outputs.ref }}
        run: |
          echo "terraform=$(docker run --rm "$REF" terraform version -json | jq -r .terraform_version)" >> "$GITHUB_OUTPUT"
          echo "node=$(docker run --rm "$REF" node --version)" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        env:
          IMAGE: ${{ steps.rel.outputs.image }}
          REPO_SLUG: ${{ github.repository }}
        run: bash scripts/ci/release-assets.sh dist

      - name: Generate release notes section
        env:
          IMAGE: ${{ steps.rel.outputs.image }}
          DIGEST: ${{ steps.src.outputs.digest }}
          SHA: ${{ steps.rel.outputs.sha }}
          SOURCE_TAG: ${{ steps.src.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TF_VERSION: ${{ steps.versions.outputs.terraform }}
          NODE_VERSION: ${{ steps.versions.outputs.node }}
        run: bash scripts/ci/release-notes.sh > dist/release-details.md

      - name: Check the release exists
        id: gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch on a bare tag: the image is promoted, but there
            # is no release to attach assets or notes to.
            echo "::notice::No GitHub release for $RELEASE_TAG; skipping assets and notes."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        if: steps.gh.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/proxmox-portal.sh dist/compose.yml dist/SHA256SUMS

      - name: Add details to release notes
        if: steps.gh.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > dist/body-current.md
          # Drop a previous generated section, keep everything else.
          awk '
            /<!-- release-details:start -->/ { skip = 1; next }
            /<!-- release-details:end -->/   { skip = 0; next }
            !skip
          ' dist/body-current.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > dist/body-kept.md
          {
            if [ -s dist/body-kept.md ]; then
              cat dist/body-kept.md
              printf '\n\n'
            fi
            cat dist/release-details.md
          } > dist/body-new.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/body-new.md

      - name: Verify release assets are downloadable
        if: steps.gh.outputs.exists == 'true' && !github.event.repository.private
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          mkdir -p dist/check && cd dist/check
          for f in proxmox-portal.sh compose.yml SHA256SUMS; do
            curl -fsSLO --retry 5 --retry-delay 3 --retry-all-errors "$base/$f"
          done
          sha256sum -c SHA256SUMS
          bash -n proxmox-portal.sh
          grep -qxF "PORTAL_TAG=\"\${PORTAL_TAG:-$RELEASE_TAG}\"" proxmox-portal.sh
          # The LXC script fetches its install/ half from the tag at run time.
          curl -fsSI --retry 5 --retry-delay 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_TAG/deploy/lxc/install/proxmox-portal-install.sh" >/dev/null

      - name: Summary
        run: cat dist/release-details.md >> "$GITHUB_STEP_SUMMARY"
